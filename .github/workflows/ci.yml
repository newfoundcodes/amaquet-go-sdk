name: Amaquet Go SDK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go version
        run: go version

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Build all packages and examples
        run: go build ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race-enabled tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Run fuzz smoke test
        if: matrix.os == 'ubuntu-latest'
        run: go test -run '^$' -fuzz '^FuzzSDKWriteOptions$' -fuzztime=10s
